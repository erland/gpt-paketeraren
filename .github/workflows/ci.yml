name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python packager
        run: |
          python tests/test_instruction_contract.py
          python tests/test_roundtrip.py
          python tests/test_release_contract.py

      - name: Project hygiene
        run: python scripts/project_hygiene.py

      - name: Build project and runtime distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,plugin,claude,opencode

      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root . --version 0.0.0-ci

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install PWA dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Test PWA
        working-directory: web
        run: npm test

      - name: Cross-runtime compatibility
        env:
          GPT_PACKAGER_COMPAT_DIR: ${{ github.workspace }}/.compat
        run: |
          python tests/cross_runtime_compat.py prepare .compat
          npm --prefix web run test:compat
          python tests/cross_runtime_compat.py verify .compat

      - name: Typecheck PWA
        working-directory: web
        run: npm run typecheck

      - name: Build PWA
        working-directory: web
        run: npm run build
