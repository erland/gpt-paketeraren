name: Generate web lockfile

on:
  push:
    branches: [chore/reproducible-web-build]
    paths:
      - ".github/workflows/generate-web-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/reproducible-web-build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate package-lock.json
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Add web dependency lockfile"
          git push origin HEAD:chore/reproducible-web-build
